[package]
name = "anneal-cli"
version.workspace = true
edition.workspace = true
description = "The `anneal` command-line interface — thin orchestration over the build system."

[[bin]]
name = "anneal"
path = "src/main.rs"

[dependencies]
anneal-core = { path = "../anneal-core" }
anneal-loader = { path = "../anneal-loader" }
anneal-analysis = { path = "../anneal-analysis" }
anneal-rules = { path = "../anneal-rules" }
anneal-exec = { path = "../anneal-exec" }
anneal-store = { path = "../anneal-store" }
anneal-query = { path = "../anneal-query" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
anneal-core = { path = "../anneal-core" }
tempfile = "3"

[lints]
workspace = true
